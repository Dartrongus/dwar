<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Меню</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

:root {
    --bg: #0b0e13;
    --card: #151a21;
    --card-hover: #1b212a;
    --border: #252c35;
    --text: #e8ebef;
    --accent: #4f8cff;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: flex-start;

    background: var(--bg);
    color: var(--text);

    font-family: 'Inter', sans-serif;
}

.links {
    width: min(600px, calc(100% - 32px));
    margin-top: 80px;

    display: flex;
    flex-direction: column;
    gap: 10px;
}

.link {
    display: flex;
    align-items: center;

    min-height: 58px;
    padding: 0 20px;

    border: 1px solid var(--border);
    border-radius: 12px;

    background: var(--card);

    color: var(--text);
    text-decoration: none;

    font-size: 15px;
    font-weight: 500;

    transition:
        background .2s ease,
        border-color .2s ease,
        transform .2s ease;
}

.link:hover {
    background: var(--card-hover);
    border-color: #37414e;
    transform: translateY(-1px);
}

.link::after {
    content: "→";

    margin-left: auto;

    color: #687384;
    font-size: 18px;

    transition:
        color .2s ease,
        transform .2s ease;
}

.link:hover::after {
    color: var(--accent);
    transform: translateX(3px);
}

@media (max-width: 600px) {

    .links {
        margin-top: 40px;
    }

    .link {
        min-height: 54px;
        padding: 0 16px;
    }
}
</style>
</head>

<body>

<div class="links">

    <a class="link"
       href="https://dartrongus.github.io/dwar/diamond-fair"
       target="_blank"
       rel="noopener">
        Бриллиантовая Ярмарка(цены)
    </a>

    <a class="link"
       href="https://dartrongus.github.io/dwar/arcat-calc"
       target="_blank"
       rel="noopener">
        Калькулятор аркатов
    </a>

    <a class="link"
       href="https://dartrongus.github.io/dwar/ezda"
       target="_blank"
       rel="noopener">
        Сравнение новой езды
    </a>

    <a class="link"
       href="https://dartrongus.github.io/dwar/shmot"
       target="_blank"
       rel="noopener">
        Просмотр шмоток(без закрывашки)
    </a> 
    
    <a class="link"
       href="https://dartrongus.github.io/dwar/menu"
       target="_blank"
       rel="noopener">
        Другой проект
    </a>

</div>

</body>
</html>
